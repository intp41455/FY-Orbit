<?xml version="1.0" encoding="UTF-8"?>
<!--
  FY 纯图形标 —— 单色纯黑版（正片）
  用途：单色印刷、发票、水印、浅底文档
  做法：黑色实心圆角方 + FY 反白镂空（mask 挖空，真实透明，可压在任意底色上）
  注意：镂空处透出的是承载底色，因此务必压在浅底（#FFFFFF / #F5F6F8 类）上使用
-->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"
     role="img" aria-label="FY 图形标（单色纯黑）">
  <title>FY 图形标（单色纯黑）</title>
  <defs>
    <mask id="fyMonoKnockout" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="480">
      <rect x="80" y="80" width="320" height="320" rx="83" ry="83" fill="#FFFFFF"/>
      <g transform="translate(134.15 167.5) scale(1.45)" fill="#000000">
        <path d="M0 0 H64 V24 H24 V42 H56 V66 H24 V100 H0 Z"/>
        <path d="M72 0 H94 L109 26 L124 0 H146 L120 44 V100 H98 V44 Z"/>
      </g>
    </mask>
  </defs>
  <rect x="80" y="80" width="320" height="320" rx="83" ry="83" fill="#000000" mask="url(#fyMonoKnockout)"/>
</svg>
