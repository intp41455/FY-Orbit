<?xml version="1.0" encoding="UTF-8"?>
<!--
  FY 纯图形标（Square Mark）
  来源：brand-visual-system-2026-10-06.md 2.1 / 附录 D
  色值：线性渐变 150deg，#35E0C8 → #1FA894；字母 #04211D
  几何：图形标边长 X = 320，四周留白 80 = 0.25X（满足「安全区不小于 1/4 边长」）
       圆角 r = 83 = 0.259X（与落地页 .mark 的 10px/34px ≈ 0.294X 取折中，兼顾 app icon 观感）
  字标：FY 为手写几何路径（非文字），保证任何渲染器下形状一致
-->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"
     role="img" aria-label="FY 图形标">
  <title>FY 图形标</title>
  <defs>
    <!-- CSS linear-gradient(150deg,#35E0C8,#1FA894) 的等价参数
         方向向量 (sin150, -cos150) = (0.5, 0.866)，对正方形 bbox 换算得下列坐标 -->
    <linearGradient id="fyMarkGradient" x1="0.1585" y1="-0.0915" x2="0.8415" y2="1.0915">
      <stop offset="0" stop-color="#35E0C8"/>
      <stop offset="1" stop-color="#1FA894"/>
    </linearGradient>
  </defs>

  <rect x="80" y="80" width="320" height="320" rx="83" ry="83" fill="url(#fyMarkGradient)"/>

  <!-- FY 字标：原生网格 146×100（cap height 100），scale 1.45 → 211.7×145，于 320 方标内居中 -->
  <g transform="translate(134.15 167.5) scale(1.45)" fill="#04211D">
    <!-- F -->
    <path d="M0 0 H64 V24 H24 V42 H56 V66 H24 V100 H0 Z"/>
    <!-- Y -->
    <path d="M72 0 H94 L109 26 L124 0 H146 L120 44 V100 H98 V44 Z"/>
  </g>
</svg>
