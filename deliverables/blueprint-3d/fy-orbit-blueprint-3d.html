<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FY-Orbit 星轨 · 全景架构蓝图 3D</title>
<style>
  :root{
    --bg:#07090f; --panel:rgba(16,20,32,.86); --line:rgba(255,255,255,.11);
    --tx:#e8ecf5; --tx2:#96a0b8; --tx3:#5f6a82;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --core:#38bdf8; --vio:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  canvas{display:block}
  #stage{position:fixed;inset:0}

  .panel{background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px}

  /* 顶栏 */
  #top{position:fixed;top:14px;left:14px;right:14px;height:54px;display:flex;
    align-items:center;gap:14px;padding:0 16px;z-index:10}
  #top h1{font-size:15px;font-weight:500;letter-spacing:.3px;white-space:nowrap}
  #top .ver{font-size:11px;color:var(--tx3);font-family:ui-monospace,monospace;
    padding:2px 7px;border:1px solid var(--line);border-radius:5px}
  #top .sp{flex:1}
  #top .stat{font-size:11px;color:var(--tx2);display:flex;gap:5px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}

  /* 左侧图层树 */
  #left{position:fixed;top:80px;left:14px;bottom:14px;width:262px;z-index:10;
    display:flex;flex-direction:column;overflow:hidden}
  #left .hd{padding:12px 14px 9px;font-size:12px;color:var(--tx2);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  #tree{flex:1;overflow-y:auto;padding:7px}
  #tree::-webkit-scrollbar{width:5px}
  #tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .lyr{border-radius:8px;margin-bottom:4px;overflow:hidden;border:1px solid transparent}
  .lyr.on{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.07)}
  .lyr .row{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer;
    font-size:12px;transition:background .12s}
  .lyr .row:hover{background:rgba(255,255,255,.05)}
  .lyr .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyr .ct{font-size:10px;color:var(--tx3);font-family:ui-monospace,monospace}
  .lyr .kids{display:none;padding:1px 0 5px 15px}
  .lyr.on .kids{display:block}
  .kid{display:flex;align-items:center;gap:6px;padding:4px 7px;font-size:11px;
    color:var(--tx2);cursor:pointer;border-radius:5px}
  .kid:hover{background:rgba(255,255,255,.06);color:var(--tx)}
  .kid.sel{background:rgba(56,189,248,.17);color:var(--tx)}
  /* 编号与 3D 场景里节点头顶的数字牌一一对应 */
  .kid .ix{width:15px;height:15px;line-height:15px;text-align:center;flex:none;
    font-size:9.5px;font-weight:700;border-radius:4px;
    background:rgba(255,255,255,.09);color:var(--tx2);font-family:ui-monospace,monospace}
  .kid.sel .ix{background:rgba(56,189,248,.32);color:#fff}
  .badge{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:4px;
    font-weight:500;letter-spacing:.2px}
  .b-ok{background:rgba(52,211,153,.16);color:var(--ok)}
  .b-warn{background:rgba(251,191,36,.16);color:var(--warn)}
  .b-bad{background:rgba(248,113,113,.16);color:var(--bad)}

  /* 右侧详情 */
  #right{position:fixed;top:80px;right:14px;bottom:14px;width:352px;z-index:10;
    display:flex;flex-direction:column;overflow:hidden}
  #detail{flex:1;overflow-y:auto;padding:15px}
  #detail::-webkit-scrollbar{width:5px}
  #detail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  #detail h2{font-size:15px;font-weight:500;margin-bottom:3px}
  #detail .sub{font-size:11px;color:var(--tx3);margin-bottom:13px;
    font-family:ui-monospace,monospace}
  #detail .kv{display:flex;gap:8px;padding:5px 0;font-size:12px;
    border-bottom:1px solid rgba(255,255,255,.05)}
  #detail .kv .k{color:var(--tx3);width:74px;flex-shrink:0}
  #detail .kv .v{flex:1;color:var(--tx2);word-break:break-word}
  #detail p{font-size:12px;color:var(--tx2);line-height:1.65;margin:11px 0}
  #detail pre{background:rgba(0,0,0,.42);border:1px solid var(--line);
    border-radius:7px;padding:9px 10px;font-size:10.5px;color:#9fb3d9;
    overflow-x:auto;margin:8px 0;line-height:1.5;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sect{font-size:11px;color:var(--tx3);margin:15px 0 5px;letter-spacing:.4px;
    text-transform:uppercase}
  .ev{display:block;font-size:10.5px;color:#7c9fd4;font-family:ui-monospace,monospace;
    padding:3px 7px;border-left:2px solid rgba(124,159,212,.35);margin:3px 0;
    cursor:pointer;word-break:break-all}
  .ev:hover{color:#b8d0f5;border-left-color:var(--core)}
  .empty{padding:26px 12px;text-align:center;color:var(--tx3);font-size:12px;line-height:1.7}

  /* 底部控制 */
  #bot{position:fixed;bottom:14px;left:290px;z-index:10;padding:8px 12px;
    display:flex;gap:7px;align-items:center}
  .btn{font-size:11px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--tx2);cursor:pointer;transition:.13s;
    white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.11);color:var(--tx)}
  .btn.on{background:rgba(56,189,248,.19);border-color:rgba(56,189,248,.5);color:#9fd8ff}
  .sep{width:1px;height:17px;background:var(--line)}

  #legend{position:fixed;bottom:14px;right:14px;z-index:10;padding:9px 12px;
    display:flex;gap:11px;font-size:10.5px;color:var(--tx2);align-items:center}

  #hint{position:fixed;top:80px;left:290px;z-index:9;font-size:11px;color:var(--tx3);
    padding:6px 11px;pointer-events:none;transition:opacity .5s}

  /* 节点在屏幕上只有约 50px 宽，任何常驻中文标签都不可能读清。
     tooltip 必须走 HTML 屏幕空间（不受 3D 缩放影响），并给出完整证据。 */
  #tip{position:fixed;pointer-events:none;padding:9px 12px;font-size:12px;line-height:1.6;
    background:rgba(8,11,19,.97);border:1px solid var(--line);border-radius:8px;
    display:none;z-index:50;max-width:330px;box-shadow:0 8px 26px rgba(0,0,0,.6)}
  #tip .tn{font-weight:700;font-size:13px;color:#eef2fa;margin-bottom:3px}
  #tip .tm{color:#96a0b8;font-size:11px;font-family:ui-monospace,monospace}
  #tip .te{margin-top:5px;padding-top:5px;border-top:1px solid #232a3a;
    color:#8fd4a0;font-size:10.5px;font-family:ui-monospace,monospace;white-space:pre-line}
  #tip .tw{margin-top:5px;font-size:10.5px;color:#fbbf24}

  @media (max-width:1180px){
    #left,#right{display:none}
    #bot{left:14px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="top" class="panel">
  <h1>FY-Orbit 星轨 · 全景架构蓝图</h1>
  <span class="ver" id="ver">v70</span>
  <span class="sp"></span>
  <span class="stat"><i class="dot" style="background:var(--ok)"></i>真实实现 <b id="sOk">0</b></span>
  <span class="stat"><i class="dot" style="background:var(--warn)"></i>部分实现 <b id="sWarn">0</b></span>
  <span class="stat"><i class="dot" style="background:var(--bad)"></i>空壳/断链 <b id="sBad">0</b></span>
  <span class="stat" style="padding-left:11px;border-left:1px solid var(--line)">
    <b id="sNode">0</b> 节点</span>
</div>

<div id="left" class="panel">
  <div class="hd">◈ 架构分层 <span style="margin-left:auto;font-size:10px">点击展开</span></div>
  <div id="tree"></div>
</div>

<div id="right" class="panel">
  <div class="hd">◈ 节点详情</div>
  <div id="detail"><div class="empty">点击任意节点或左侧列表<br>查看实现状态与代码证据</div></div>
</div>

<div id="hint" class="panel">拖拽旋转 · 滚轮缩放 · 右键平移 · 点击节点看证据</div>

<div id="bot" class="panel">
  <button class="btn on" id="bAll">全部</button>
  <button class="btn" id="bEx">展开分层</button>
  <button class="btn" id="bReal">仅真实</button>
  <button class="btn" id="bGap">仅断链</button>
  <div class="sep"></div>
  <button class="btn" id="bReset">复位</button>
  <button class="btn" id="bSpin">自转</button>
</div>

<div id="legend" class="panel">
  <span><i class="dot" style="background:var(--ok)"></i> 真实</span>
  <span><i class="dot" style="background:var(--warn)"></i> 部分</span>
  <span><i class="dot" style="background:var(--bad)"></i> 空壳</span>
</div>

<div id="tip"></div>

<script src="vendor.js"></script>

/* ==========================================================================
   3D 渲染
   ========================================================================== */
const ST_COLOR={real:0x34d399,warn:0xfbbf24,gap:0xf87171};
const ST_CSS={real:'#34d399',warn:'#fbbf24',gap:'#f87171'};
const ST_TXT={real:'真实实现',warn:'部分实现',gap:'空壳 / 断链'};

let allNodes=[];
DATA.forEach(l=>l.nodes.forEach(n=>{n.layer=l.id;allNodes.push(n)}));
DOMAINS.forEach(d=>d.nodes.forEach(n=>{n.layer=d.id;allNodes.push(n)}));

/* ---- 渲染器 ---- */
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x07090f,0.0042);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,1,4000);
// 整栈包围盒约 x∈[-58,79]、y∈[-54,54]；可用画布宽 1290 / 高 980（两侧面板各占 170 / 300）。
// fov 42° 要装下 137×108 ⇒ 距离需 ~165。取 173 留一点余量，
// 方位 3/4 偏右（dx:dz ≈ 100:118），仰角 ~27°，兼顾层板进深与层名牌。
camera.position.set(114,78,118);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.075;
controls.minDistance=42;controls.maxDistance=620;
controls.target.set(10,0,0);

/* ---- 灯光 ---- */
scene.add(new THREE.AmbientLight(0x8fa8d8,.62));
const k1=new THREE.DirectionalLight(0xffffff,.92);k1.position.set(70,110,80);scene.add(k1);
const k2=new THREE.DirectionalLight(0x38bdf8,.5);k2.position.set(-90,40,-60);scene.add(k2);
const k3=new THREE.DirectionalLight(0xc084fc,.34);k3.position.set(20,-90,-70);scene.add(k3);

/* ---- 背景星尘 ---- */
(function(){
  const N=2600,p=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=280+Math.random()*720,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);
    p[i*3+1]=r*Math.cos(ph)*.62;
    p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0x4a6a9e,size:1.5,sizeAttenuation:true,
    transparent:true,opacity:.5,depthWrite:false});
  scene.add(new THREE.Points(g,m));
})();

/* ---- 几何工具 ---- */
const boxGeo=new THREE.BoxGeometry(1,1,1);
function mat(st,opacity=1,emissive=0){
  return new THREE.MeshStandardMaterial({
    color:ST_COLOR[st],transparent:opacity<1,opacity,
    roughness:.36,metalness:.28,
    emissive:ST_COLOR[st],emissiveIntensity:emissive
  });
}
function edgeBox(w,h,d,color,op=.5){
  const g=new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({
    color,transparent:true,opacity:op}));
}

/* ---- 节点对象表 ---- */
// 证据文本里含 < > & (如 dict[str,Any]、泛型签名)，直接塞 innerHTML 会破坏 DOM。
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pickables=[],animNodes=[],plateGroups={};

const LY=[]; // 每层的 Y 坐标
// 层距 17：节点名牌顶部约到 y+10，下一层顶面约在 y+15.8，留 5.8 单位净空。
// 之前用 25 是为了「拉开层次」，但整栈因此高达 175 而层板宽仅 55，
// 纵横比 1:3.2 → 相机被迫拉到 232 距离，名牌缩到 18px 高不可读。
// 压到 17 后整栈 102 高 / 152 宽，相机距离降到 ~122，名牌像素高度翻倍。
const LAYER_GAP=17;
DATA.forEach((l,i)=>{ LY[i]=(DATA.length-1-i-(DATA.length-1)/2)*LAYER_GAP; });
const LYOF={};DATA.forEach((l,i)=>LYOF[l.id]=LY[i]);

/* ---- 层板构建（分层栈与纵切域共用） ---- */
function buildPlate(l,y,opt){
  opt=opt||{};
  const cnt=l.nodes.length;
  // 列宽固定 → 所有层板同宽同深，纵向叠起来才像一叠「板」而不是一堆散沙。
  // 9 节点层按 5 列排成 2 行，是这个密度下最宽又最扁的比例。
  const cols=Math.min(opt.cols||5,Math.max(2,cnt));
  const rows=Math.ceil(cnt/cols);
  const GW=opt.gw||15.0, GD=opt.gd||13.0;
  const W=cols*GW+3.2, D=Math.max(rows,2)*GD+3.2;

  const grp=new THREE.Group();grp.position.y=y;
  if(opt.x)grp.position.x=opt.x;
  scene.add(grp);

  // 层板底
  const plate=new THREE.Mesh(new THREE.BoxGeometry(W,.42,D),mat(l.st,.2,.16));
  plate.position.y=-1.4;grp.add(plate);
  const eg=edgeBox(W,.42,D,ST_COLOR[l.st],.42);eg.position.y=-1.4;grp.add(eg);

  /* 层名牌。Sprite 是billboard，屏幕尺寸与深度无关，
     所以只需按世界单位给定宽度即可，字号由画布内比例决定。 */
  const cn=document.createElement('canvas');cn.width=440;cn.height=112;
  const cx=cn.getContext('2d');
  cx.fillStyle='rgba(9,12,20,.92)';
  cx.beginPath();cx.roundRect(0,0,440,112,14);cx.fill();
  cx.strokeStyle=ST_CSS[l.st];cx.lineWidth=3;cx.stroke();
  cx.fillStyle=ST_CSS[l.st];cx.fillRect(0,0,8,112);
  cx.fillStyle='#e8ecf5';cx.font='700 40px system-ui,Microsoft YaHei';
  cx.fillText(l.name,22,50);
  cx.fillStyle='#9aa5bd';cx.font='22px ui-monospace,monospace';
  cx.fillText(l.en,22,86);
  cx.fillStyle=ST_CSS[l.st];cx.font='700 24px system-ui';
  cx.textAlign='right';cx.fillText(ST_TXT[l.st],418,86);cx.textAlign='left';
  const tex=new THREE.CanvasTexture(cn);tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(26,6.62,1);
  sp.position.set(-W/2-14,1.0,0);
  sp.renderOrder=999;
  // 纵切域各自不挂层名牌：三个牌向左伸出26 单位会盖住主栈的节点编号。
  // 改由簇级总标题统一标注（见下方 DOMAINS 处理）。
  if(!opt.noName)grp.add(sp);

  // 节点
  const total=cnt,perRow=cols;
  l.nodes.forEach((nd,ni)=>{
    const r=Math.floor(ni/perRow),c=ni%perRow;
    const itemsThisRow=Math.min(perRow,total-ni);
    const x=(c-(itemsThisRow-1)/2)*GW;
    const z=(r-(rows-1)/2)*GD;

    const g=new THREE.Group();
    g.position.set(x,2.9,z);
    grp.add(g);

    const H=3.5,D2=8.0,W2=12.4;
    const b=new THREE.Mesh(boxGeo,mat(nd.st,.93,.3));
    b.scale.set(W2,H,D2);g.add(b);
    const e=edgeBox(W2,H,D2,ST_COLOR[nd.st],.62);g.add(e);

    // WIP（未入库）标识：虚线外框 + 顶部角标。
    // 实心画法会让人以为这是已交付能力，实际上它只在工作区，随时可能回滚。
    if(nd.wip){
      const wg=new THREE.EdgesGeometry(new THREE.BoxGeometry(W2+1.5,H+1.5,D2+1.5));
      const wl=new THREE.LineSegments(wg,new THREE.LineDashedMaterial({
        color:0xfbbf24,transparent:true,opacity:.85,dashSize:1.1,gapSize:.75}));
      wl.computeLineDistances();g.add(wl);
      const wn=document.createElement('canvas');wn.width=140;wn.height=56;
      const wx=wn.getContext('2d');
      wx.fillStyle='#fbbf24';wx.beginPath();wx.roundRect(2,2,136,52,10);wx.fill();
      wx.fillStyle='#1a1205';wx.font='800 38px system-ui,Microsoft YaHei';
      wx.textAlign='center';wx.fillText('未入库',70,46);
      const wt=new THREE.CanvasTexture(wn);
      const ws=new THREE.Sprite(new THREE.SpriteMaterial({map:wt,transparent:true,depthTest:false}));
      ws.scale.set(6.2,2.48,1);
      ws.position.set(W2/2-1.4,H/2+1.6,3.4);ws.renderOrder=1000;
      g.add(ws);
    }

    // 顶面高亮条
    const cap=new THREE.Mesh(boxGeo,new THREE.MeshStandardMaterial({
      color:ST_COLOR[nd.st],emissive:ST_COLOR[nd.st],
      emissiveIntensity:.85,roughness:.3}));
    cap.scale.set(W2*.82,.2,D2*.72);cap.position.y=H/2+.11;g.add(cap);

    // 状态灯
    const led=new THREE.Mesh(new THREE.SphereGeometry(.52,14,14),
      new THREE.MeshBasicMaterial({color:ST_COLOR[nd.st]}));
    led.position.set(-W2/2+1.15,H/2+.42,0);g.add(led);

    /* 节点标牌。
       节点屏幕尺寸约 50×35px —— 这个尺寸下任何常驻中文都不可能读清
       （3D 场景约 3.4px/世界单位，11.4 宽的牌子只有 ~39px）。
       所以常驻只放「层内编号」（1~2 个字符，38px 字号必然清晰），
       完整名称 / 参数 / 代码证据交给悬停 tooltip 与点击详情面板。*/
    const lw=128,lh=68;
    const ln=document.createElement('canvas');ln.width=lw;ln.height=lh;
    const lx=ln.getContext('2d');
    lx.fillStyle='rgba(8,11,19,.94)';
    lx.beginPath();lx.roundRect(0,0,lw,lh,9);lx.fill();
    lx.strokeStyle=ST_CSS[nd.st];lx.lineWidth=3;lx.stroke();
    // 纵切域用C/K/A 前缀区分，否则 Cabin-1 与 L3-1 都是「1」，编号失去唯一性。
    lx.fillStyle='#eef2fa';
    lx.font=(opt.tag?'800 30px':'800 40px')+' system-ui,Microsoft YaHei';
    lx.textAlign='center';lx.textBaseline='middle';
    lx.fillText(opt.tag?opt.tag+(ni+1):String(ni+1),lw/2,lh/2+2);
    lx.textAlign='left';lx.textBaseline='alphabetic';

    const t2=new THREE.CanvasTexture(ln);t2.anisotropy=8;
    const s2=new THREE.Sprite(new THREE.SpriteMaterial({
      map:t2,transparent:true,depthTest:false}));
    s2.scale.set(5.0,2.66,1);
    s2.position.set(0,H/2+2.2,0);s2.renderOrder=998;
    g.add(s2);

    const hit=new THREE.Mesh(boxGeo,new THREE.MeshBasicMaterial({visible:false}));
    hit.scale.set(W2,H+9,D2);g.add(hit);
    hit.userData={nd,base:g.position.y};
    pickables.push(hit);

    const rec={obj:g,hit,led,cap,nd,ph:Math.random()*6.28};
    animNodes.push(rec);
    nd._t=rec;
  });

  plateGroups[l.id]={grp,y,W,D};
  return plateGroups[l.id];
}

/* 分层栈 */
DATA.forEach((l,li)=>buildPlate(l,LY[li],{}));

/* 纵切应用域：横切多层，单独成簇放在右侧，不占层号。
   节点少（2/2/1），用更窄的格宽，避免右侧空出一大块板。 */
const DOM_X=58;
DOMAINS.forEach((d,i)=>{
  const y=(DOMAINS.length-1-i-(DOMAINS.length-1)/2)*18;
  buildPlate(d,y,{x:DOM_X,cols:2,gw:13.5,gd:12,tag:d.tag,noName:true});
  LYOF[d.id]=y;
});
/* 「横切多层」用竖直光束表达，而不是横向连线 ——
   横向连线会被主栈层板遮掉一半，且视觉上暗示"只连某几层"，与事实不符。
   这三条是各自独立的纵切产品线，同时横切多层，因此画成贯穿层栈的竖光柱。 */
(function(){
  const top=LY[0],bot=LY[LY.length-1];
  const pts=[];
  DOMAINS.forEach((d,i)=>{
    const y=(DOMAINS.length-1-i-(DOMAINS.length-1)/2)*18;
    const g=new THREE.BufferGeometry();
    const x=DOM_X-14;
    // 从本域层板向上/向下延伸到栈顶与栈底，途经所有分层
    pts.length=0;
    pts.push(x,y-6,0, x,top+7,0, x,y+6,0, x,bot-7,0);
    g.setAttribute('position',new THREE.Float32BufferAttribute(pts.slice(),3));
    const ln=new THREE.LineSegments(g,new THREE.LineDashedMaterial({
      color:0xc084fc,transparent:true,opacity:.34,dashSize:1.8,gapSize:1.4}));
    ln.computeLineDistances();   // 虚线必须先算累积距离，否则整条线显示为实线
    scene.add(ln);
  });
})();

/* ---- 层间连接光束 ---- */
(function(){
  const pts=[];
  for(let i=0;i<DATA.length-1;i++){
    const yA=LY[i],yB=LY[i+1];
    const cA=plateGroups[DATA[i].id].W*.42;
    const cB=plateGroups[DATA[i+1].id].W*.42;
    pts.push(-cA,yA-1.6,0, -cB,yB+1.6,0);
    pts.push(cA,yA-1.6,0, cB,yB+1.6,0);
    pts.push(0,yA-1.6,0, 0,yB+1.6,0);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({
    color:0x38bdf8,transparent:true,opacity:.17})));
})();

/* ---- 层标签环绕 ---- */
DATA.forEach((l,i)=>{
  const g=plateGroups[l.id];
  const cn=document.createElement('canvas');cn.width=200;cn.height=84;
  const cx=cn.getContext('2d');
  cx.font='800 62px system-ui,Microsoft YaHei';
  cx.fillStyle=ST_CSS[l.st];cx.textAlign='center';
  cx.fillText(`L${i+1}`,100,64);
  const tex=new THREE.CanvasTexture(cn);tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex,transparent:true,depthTest:false,opacity:.9}));
  sp.scale.set(5.6,2.35,1);
  sp.position.set(g.W/2+4.2,g.y,0);sp.renderOrder=997;
  scene.add(sp);
});

/* 纵切域簇标题：不编层号，因为它们不是"第 N 层"。
   三个域各自不挂层名牌（会盖住主栈），所以这个标题下方直接列出
   C/K/A 三个域的中文名，保证不悬停也能读出右侧那簇是什么。 */
(function(){
  const names=['Cabin 像素世界','知识与RAG 域','Agent 域'];
  const cn=document.createElement('canvas');cn.width=460;cn.height=190;
  const cx=cn.getContext('2d');
  cx.fillStyle='rgba(12,9,20,.94)';
  cx.beginPath();cx.roundRect(0,0,460,190,13);cx.fill();
  cx.strokeStyle='#c084fc';cx.lineWidth=3;cx.stroke();
  cx.fillStyle='#c084fc';cx.fillRect(0,0,8,190);
  cx.fillStyle='#e8ecf5';cx.font='700 38px system-ui,Microsoft YaHei';
  cx.fillText('纵切应用域',22,46);
  cx.fillStyle='#a08cc4';cx.font='20px ui-monospace,monospace';
  cx.fillText('Vertical Domains · 横切多层',22,76);
  cx.strokeStyle='#3b2f52';cx.lineWidth=1.5;
  cx.beginPath();cx.moveTo(22,90);cx.lineTo(438,90);cx.stroke();
  cx.font='24px system-ui,Microsoft YaHei';
  names.forEach((t,i)=>{
    const y=120+i*27;
    cx.fillStyle='#c084fc';cx.font='700 24px ui-monospace,monospace';
    cx.fillText(['C','K','A'][i],22,y);
    cx.fillStyle='#cdc4dd';cx.font='24px system-ui,Microsoft YaHei';
    cx.fillText(t,50,y);
  });
  const tex=new THREE.CanvasTexture(cn);tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex,transparent:true,depthTest:false}));
  sp.scale.set(34.5,14.25,1);
  sp.position.set(DOM_X,44,0);sp.renderOrder=999;
  scene.add(sp);
})();

/* ==========================================================================
   侧栏 UI
   ========================================================================== */
const tree=document.getElementById('tree');
let selNode=null;

function statusBadge(st){
  const m={real:['b-ok','真实'],warn:['b-warn','部分'],gap:['b-bad','断链']};
  return `<span class="badge ${m[st][0]}">${m[st][1]}</span>`;
}

function addTreeItem(l,label){
  const d=document.createElement('div');
  d.className='lyr';d.dataset.lid=l.id;
  d.innerHTML=`<div class="row">
      <i class="dot" style="background:${ST_CSS[l.st]}"></i>
      <span class="nm">${label}</span>
      <span class="ct">${l.nodes.length}</span>
    </div><div class="kids">
    ${l.nodes.map((n,i)=>`<div class="kid" data-nid="${n.id}">
        <b class="ix">${l.tag?l.tag+(i+1):(i+1)}</b>
        <i class="dot" style="background:${ST_CSS[n.st]}"></i>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.name)}</span>
        ${n.wip?'<span class="badge b-warn">WIP</span>':''}
        ${statusBadge(n.st)}</div>`).join('')}
    </div>`;
  d.querySelector('.row').onclick=e=>{
    e.stopPropagation();
    const was=d.classList.contains('on');
    document.querySelectorAll('.lyr').forEach(x=>x.classList.remove('on'));
    if(!was) d.classList.add('on');
  };
  tree.appendChild(d);
}

DATA.forEach((l,li)=>addTreeItem(l,`L${li+1} ${l.name}`));

const domHd=document.createElement('div');
domHd.style.cssText='font-size:10.5px;color:#c084fc;padding:9px 9px 4px;letter-spacing:.3px';
domHd.textContent='纵切应用域 · 横切多层';
tree.appendChild(domHd);
DOMAINS.forEach(d=>addTreeItem(d,d.name));

tree.addEventListener('click',e=>{
  const k=e.target.closest('.kid');if(!k)return;
  document.querySelectorAll('.kid').forEach(x=>x.classList.remove('sel'));
  k.classList.add('sel');
  const nd=allNodes.find(n=>n.id===k.dataset.nid);
  select(nd,true);
});

/* ---- 详情渲染 ---- */
const detail=document.getElementById('detail');
function select(nd,fly){
  selNode=nd;
  if(!nd){detail.innerHTML='<div class="empty">点击任意节点或左侧列表<br>查看实现状态与代码证据</div>';return;}
  const l=[...DATA,...DOMAINS].find(x=>x.id===nd.layer);
  const isDom=!!DOMAINS.find(x=>x.id===nd.layer);
  const li=DATA.indexOf(l);
  const locTxt=isDom?`${l.name} · 纵切域`:`${l.name} · L${li+1}`;
  detail.innerHTML=`
    <h2>${nd.name}</h2>
    <div class="sub">${locTxt}</div>
    <div style="margin-bottom:11px">${statusBadge(nd.st)}
      <span style="font-size:11px;color:var(--tx3);margin-left:7px">${ST_TXT[nd.st]}</span>
      ${nd.wip?'<span class="badge b-warn" style="margin-left:7px">未入库</span>':''}</div>
    ${nd.wip?'<div class="sect" style="color:#fbbf24">版本状态</div>'+
      '<p style="color:#fbbf24">此模块尚未进入版本库，仅存在于工作区。最新提交 80af527 与 hub 编排无关，随时可能回滚或重写——不要把它当作已交付能力。</p>':''}
    ${Object.entries(nd.meta||{}).map(([k,v])=>
      `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    <p>${nd.desc}</p>
    <div class="sect">代码证据</div>
    ${(nd.ev||[]).map(e=>`<code class="ev">${e}</code>`).join('')}
  `;
  if(fly)flyTo(nd);
}

function flyTo(nd){
  const r=nd._t.obj.getWorldPosition(new THREE.Vector3());
  const tgt=r.clone();tgt.y-=1.5;
  flyAnim={s:camera.position.clone(),e:tgt.clone(),ts:controls.target.clone(),tt:tgt,
           t0:performance.now(),dur:820};
}

/* ---- 悬停提示 ---- */
const tip=document.getElementById('tip');
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let hovered=null;

renderer.domElement.addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  tip.style.left=e.clientX+13+'px';
  tip.style.top=e.clientY+13+'px';
});
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if(hit){
    const nd=hit.object.userData.nd;
    document.querySelectorAll('.kid').forEach(x=>x.classList.remove('sel'));
    const k=document.querySelector(`.kid[data-nid="${nd.id}"]`);
    if(k){k.classList.add('sel');
      k.closest('.lyr').classList.add('on');}
    select(nd,false);
  }
});

/* ==========================================================================
   控件
   ========================================================================== */
let flyAnim=null;
document.getElementById('bReset').onclick=()=>{
  camera.position.set(114,78,118);
  controls.target.set(10,0,0);
  controls.update();
};
let spin=false;
document.getElementById('bSpin').onclick=e=>{
  spin=!spin;e.target.classList.toggle('on',spin);
};

let filterMode='all';
function applyFilter(){
  document.querySelectorAll('[data-btn]').forEach(b=>b.classList.remove('on'));
  const map={all:'bAll',ex:'bEx',real:'bReal',gap:'bGap'};
  document.getElementById(map[filterMode]).classList.add('on');

  const show={all:()=>true,ex:()=>true,real:n=>n.st==='real',gap:n=>n.st!=='real'}[filterMode];
  animNodes.forEach(r=>{
    r.on=show(r.nd);
    r.obj.visible=true;
    r.hit.visible=r.on;
  });
  if(filterMode==='gap'){
    // 断链模式下把真实节点压暗
    animNodes.forEach(r=>{
      r.obj.traverse(o=>{
        if(o.material&&o.material.color&&o.material.emissive!==undefined){
          if(r.nd.st==='real'){o.material.transparent=true;o.material.opacity=.16;}
          else{o.material.transparent=true;o.material.opacity=.95;}
        }
      });
    });
  }else{
    animNodes.forEach(r=>{
      r.obj.traverse(o=>{
        if(o.material&&o.material.emissive!==undefined&&o.material.transparent){
          o.material.opacity=(o.material.type==='SpriteMaterial')?.95:.93;
        }
      });
    });
  }
}
['bAll','bEx','bReal','bGap'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    filterMode=id.replace('b','').toLowerCase()==='ex'?'ex':id.replace('b','').toLowerCase();
    applyFilter();
    if(filterMode==='ex')explode();
    else collapse();
  };
});
function explode(){collapseT=1;}
function collapse(){collapseT=0;}
let collapseT=0;

/* ---- 统计 ---- */
(function(){
  let r=0,w=0,g=0;
  allNodes.forEach(n=>{n.st==='real'?r++:n.st==='warn'?w++:g++});
  document.getElementById('sOk').textContent=r;
  document.getElementById('sWarn').textContent=w;
  document.getElementById('sBad').textContent=g;
  document.getElementById('sNode').textContent=allNodes.length;
  document.getElementById('ver').textContent=
    '332 py · services 65,549 行 · '+DATA.length+' 层';
})();

/* ==========================================================================
   主循环
   ========================================================================== */
function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta(),t=clock.elapsedTime;

  if(spin){const a=.0016;const x=camera.position.x-controls.target.x;
    const z=camera.position.z-controls.target.z;
    camera.position.x=controls.target.x+x*Math.cos(a)-z*Math.sin(a);
    camera.position.z=controls.target.z+x*Math.sin(a)+z*Math.cos(a);}

  // 飞行
  if(flyAnim){
    const k=Math.min(1,(performance.now()-flyAnim.t0)/flyAnim.dur);
    const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(flyAnim.s,flyAnim.e,e);
    controls.target.lerpVectors(flyAnim.ts,flyAnim.tt,e);
    if(k>=1)flyAnim=null;
  }

  // 呼吸 + 悬停高亮
  animNodes.forEach(r=>{
    const on=r.on!==false;
    const sel=selNode&&selNode.id===r.nd.id;
    const hov=hovered&&hovered.object.userData.nd.id===r.nd.id;
    const lift=(sel?1.5:hov?.62:0);
    const by=r.hit.userData.base;
    r.obj.position.y+=(by+lift+Math.sin(t*.85+r.ph)*.24-r.obj.position.y)*Math.min(1,dt*7);
    const ts=sel?1.5:hov?1.22:1;
    r.obj.scale.x+=(ts-r.obj.scale.x)*Math.min(1,dt*8);
    r.obj.scale.y+=(ts-r.obj.scale.y)*Math.min(1,dt*8);
    r.obj.scale.z+=(ts-r.obj.scale.z)*Math.min(1,dt*8);
    const pulse=sel?.95+Math.sin(t*4)*.5:(hov?.8:0);
    r.led.material.color.setHex(ST_COLOR[r.nd.st]);
    r.cap.material.emissiveIntensity=.4+pulse+(on?.35:0);
    r.obj.visible=on;
  });

  // 展开/收拢
  if(collapseT!==null){
    DATA.forEach((l,i)=>{
      const g=plateGroups[l.id].grp;
      const tv=collapseT===1?1.9:1;
      g.position.y+=(LY[i]*tv-g.position.y)*Math.min(1,dt*4.5);
      const sc=.42+.58*collapseT;
      g.scale.x+=(sc-g.scale.x)*Math.min(1,dt*4);
      g.scale.z+=(sc-g.scale.z)*Math.min(1,dt*4);
    });
    if(Math.abs(plateGroups[DATA[0].id].grp.position.y-LY[0]*1.9)<.4)collapseT=null;
  }

  controls.update();
  renderer.render(scene,camera);
}
tick();

/* 悬停射线（每帧一次，节流） */
setInterval(()=>{
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables.filter(p=>p.visible),false)[0];
  hovered=hit||null;
  if(hovered){
    const nd=hovered.object.userData.nd;
    tip.style.display='block';
    // tooltip 走 HTML 屏幕空间：3D 场景缩放不影响它，所以能给出
    // 完整名称 + 关键参数 + 前两条代码证据，而不是把字挤进 50px 的方块里。
    const metaTxt=nd.meta?Object.entries(nd.meta).slice(0,3)
      .map(([k,v])=>k+' '+v).join(' · '):'';
    tip.innerHTML=
      `<div class="tn"><i class="dot" style="background:${ST_CSS[nd.st]};margin-right:6px"></i>`+
      `${esc(nd.name)} <span style="color:${ST_CSS[nd.st]};font-size:11px">${ST_TXT[nd.st]}</span></div>`+
      (metaTxt?`<div class="tm">${esc(metaTxt)}</div>`:'')+
      (nd.ev&&nd.ev.length?`<div class="te">${esc(nd.ev.slice(0,2).join('\n'))}</div>`:'')+
      (nd.wip?'<div class="tw">⚠ 工作区未入库代码，随时可能回滚</div>':'');
    renderer.domElement.style.cursor='pointer';
  }else{
    tip.style.display='none';
    renderer.domElement.style.cursor='grab';
  }
},70);

setTimeout(()=>{const h=document.getElementById('hint');h.style.opacity='0'},7200);
applyFilter();
</script>
</body>
