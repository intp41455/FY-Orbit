# Find Yourself - 本地开发 Compose
# 范围：Postgres+pgvector、Temporal、S3 兼容私有存储(MinIO)、API、Worker、Web。
# 监控服务放在 monitoring profile，默认不启动。
#
# 安全约束（与 docs/FROZEN_CONTRACT.md 第 12 节一致）：
#   - 所有数据库 / Temporal / S3 管理端口只绑定 127.0.0.1，不暴露到局域网。
#   - 每服务具备 healthcheck、独立网络、数据卷、内存限制与非 root 配置。
#   - 本机空闲 RAM 约 4.43GB，默认分阶段启动：先起数据层，再起应用层。
#
# 分阶段启动示例（不要一次性 up 全栈）：
#   docker compose -f infra/compose.dev.yml up -d postgres minio temporal
#   # 等待 healthy 后，由协调者确认 Core/Runtime 接口就绪，再启动应用层：
#   docker compose -f infra/compose.dev.yml up -d api worker web
#   # 监控为可选 profile，单独启动，不要和应用层混在一条 up 里：
#   docker compose -f infra/compose.dev.yml --profile monitoring up -d prometheus grafana
#
# 注意：镜像 tag 为开发候选，发布时必须固定 digest 并重新核验，不得直接把 dev 配置当生产。

name: find-yourself

networks:
  fynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

volumes:
  pgdata:
  miniodata:

services:
  # ---------------------------------------------------------------- 数据层
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FY_POSTGRES_USER:-fy}
      POSTGRES_PASSWORD: ${FY_POSTGRES_PASSWORD:-fy_dev_change_me_not_for_prod}
      POSTGRES_DB: ${FY_POSTGRES_DB:-findyourself}
    # 仅绑定回环；生产不发布此端口。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FY_POSTGRES_USER:-fy} -d ${FY_POSTGRES_DB:-findyourself}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    # 官方 postgres/pgvector 镜像默认以非 root(uid 999) 运行，不额外提权。
    security_opt:
      - no-new-privileges:true

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: fy-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: ${FY_POSTGRES_USER:-fy}
      POSTGRES_PWD: ${FY_POSTGRES_PASSWORD:-fy_dev_change_me_not_for_prod}
      # 开发用独立 namespace，生产由 tctl 单独创建并启用 mTLS。
      TEMPORAL_NAMESPACE: ${FY_TEMPORAL_NAMESPACE:-default}
    ports:
      # 7233 = 前端 gRPC（应用连接）；8233 = Temporal Web / HTTP API。
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    networks:
      - fynet
    healthcheck:
      # auto-setup 镜像含 bash；用 TCP 探活 7233，避免引入额外探针二进制。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7233' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fy-minio
    restart: unless-stopped
    user: "1000:1000"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FY_MINIO_ROOT_USER:-fy-minio}
      MINIO_ROOT_PASSWORD: ${FY_MINIO_ROOT_PASSWORD:-minio_dev_change_me_not_for_prod}
    ports:
      # 9000 = S3 API；9001 = 控制台。均只绑回环。
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - fynet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # 一次性初始化：创建私有 bucket。绝不设置 public policy。
  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-16-47Z
    container_name: fy-s3-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fynet
    environment:
      MC_HOST_fy: http://${FY_MINIO_ROOT_USER:-fy-minio}:${FY_MINIO_ROOT_PASSWORD:-minio_dev_change_me_not_for_prod}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set fy http://minio:9000 "${FY_MINIO_ROOT_USER:-fy-minio}" "${FY_MINIO_ROOT_PASSWORD:-minio_dev_change_me_not_for_prod}" &&
        mc mb --ignore-existing fy/${FY_S3_BUCKET:-find-yourself} &&
        mc anonymous set none fy/${FY_S3_BUCKET:-find-yourself}
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------- 应用层
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: find-yourself/api:dev
    container_name: fy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      FY_ENVIRONMENT: ${FY_ENVIRONMENT:-local}
      FY_DATABASE_URL: postgresql+psycopg://${FY_POSTGRES_USER:-fy}:${FY_POSTGRES_PASSWORD:-fy_dev_change_me_not_for_prod}@postgres:5432/${FY_POSTGRES_DB:-findyourself}
      FY_TEMPORAL_ADDRESS: temporal:7233
      FY_TEMPORAL_NAMESPACE: ${FY_TEMPORAL_NAMESPACE:-default}
      FY_TEMPORAL_QUEUE: ${FY_TEMPORAL_QUEUE:-find-yourself}
      FY_S3_ENDPOINT: http://minio:9000
      FY_S3_BUCKET: ${FY_S3_BUCKET:-find-yourself}
      FY_S3_REGION: ${FY_S3_REGION:-us-east-1}
      FY_PUBLIC_URL: http://127.0.0.1:8000
      # 占位值；本地 dev token 仅绑回环，生产必须置空并走 OIDC。
      FY_LOCAL_TOKEN: ${FY_LOCAL_TOKEN:-}
      FY_SESSION_SECRET: ${FY_SESSION_SECRET:-replace-me-with-at-least-32-random-chars}
    command: ["uvicorn", "find_yourself.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - fynet
    healthcheck:
      # 运行镜像内即 Python，用 stdlib urllib 探活，避免额外装 curl。
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: find-yourself/worker:dev
    container_name: fy-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      FY_ENVIRONMENT: ${FY_ENVIRONMENT:-local}
      FY_DATABASE_URL: postgresql+psycopg://${FY_POSTGRES_USER:-fy}:${FY_POSTGRES_PASSWORD:-fy_dev_change_me_not_for_prod}@postgres:5432/${FY_POSTGRES_DB:-findyourself}
      FY_TEMPORAL_ADDRESS: temporal:7233
      FY_TEMPORAL_NAMESPACE: ${FY_TEMPORAL_NAMESPACE:-default}
      FY_TEMPORAL_QUEUE: ${FY_TEMPORAL_QUEUE:-find-yourself}
      FY_S3_ENDPOINT: http://minio:9000
      FY_S3_BUCKET: ${FY_S3_BUCKET:-find-yourself}
      FY_S3_REGION: ${FY_S3_REGION:-us-east-1}
      FY_SESSION_SECRET: ${FY_SESSION_SECRET:-replace-me-with-at-least-32-random-chars}
    # Worker 入口由 Workflow 分片提供；当前为占位命令，仅保证 compose config 可校验。
    # TODO(Workflow): 待 Workflow 分片冻结正式 worker 模块路径后对齐此 command，不要自行猜测。
    command: ["python", "-m", "find_yourself.worker"]
    networks:
      - fynet
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: find-yourself/web:dev
    container_name: fy-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # 前端通过浏览器访问 API，仍走回环；容器内不直连后端。
      VITE_API_BASE_URL: http://127.0.0.1:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - fynet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------- 监控(profile)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fy-prometheus
    profiles: ["monitoring"]
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - fynet
    deploy:
      resources:
        limits:
          memory: 320M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fy-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${FY_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FY_GRAFANA_PASSWORD:-admin_dev_change_me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - fynet
    deploy:
      resources:
        limits:
          memory: 256M
