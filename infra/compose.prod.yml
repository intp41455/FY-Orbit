name: find-yourself-prod

networks:
  fynet-prod:
    driver: bridge

volumes:
  pgdata_prod:
  miniodata_prod:

services:
  # ---------------------------------------------------------------- 数据持久层 (Postgres + pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fy-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FY_POSTGRES_USER:-fy_prod}
      POSTGRES_PASSWORD: ${FY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FY_POSTGRES_DB:-findyourself}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - fynet-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FY_POSTGRES_USER:-fy_prod} -d ${FY_POSTGRES_DB:-findyourself}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------- 对象存储 (MinIO S3 Compatible)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fy-prod-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${FY_MINIO_ROOT_USER:-${FY_S3_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${FY_MINIO_ROOT_PASSWORD:-${FY_S3_SECRET_KEY}}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata_prod:/data
    networks:
      - fynet-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  s3-init:
    image: minio/mc:RELEASE.2025-04-16T18-16-47Z
    container_name: fy-prod-s3-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fynet-prod
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set fy http://minio:9000 "$${FY_MINIO_ROOT_USER:-$$FY_S3_ACCESS_KEY}" "$${FY_MINIO_ROOT_PASSWORD:-$$FY_S3_SECRET_KEY}" &&
        mc mb --ignore-existing fy/${FY_S3_BUCKET:-find-yourself} &&
        mc anonymous set none fy/${FY_S3_BUCKET:-find-yourself}

  # ---------------------------------------------------------------- 长任务/工作流引擎 (Temporal)
  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: fy-prod-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: ${FY_POSTGRES_USER:-fy_prod}
      POSTGRES_PWD: ${FY_POSTGRES_PASSWORD}
      TEMPORAL_NAMESPACE: ${FY_TEMPORAL_NAMESPACE:-default}
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - fynet-prod
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$$HOSTNAME/7233' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------- 后端 API 服务
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: find-yourself/app:prod
    container_name: fy-prod-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - path: .env.prod
        required: false
    ports:
      - "8000:8000"
    networks:
      - fynet-prod
    command: ["sh", "-c", "alembic upgrade head && uvicorn find_yourself.api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
