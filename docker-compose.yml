# 诚实说明：本 Compose 配的是「单机可用的本地部署形态」，而不是生产形态。
#
# 此前这里写 FY_ENVIRONMENT=production，但 FY_ENVIRONMENT=production 要求
# （见 src/find_yourself/config.py 的 validate_security）：
#   - HTTPS（FY_PUBLIC_URL 必须 https://）
#   - 禁用本地 token
#   - PostgreSQL（FY_DATABASE_URL 必须 postgresql*）
#   - Temporal（FY_TEMPORAL_ADDRESS 必填）
#   - 私有对象存储（FY_S3_ENDPOINT 必填）
#   - OIDC（FY_OIDC_* 必填）
# 而本文件恰恰配的是 SQLite + HTTP + 本地 token，二者直接冲突，
# 容器在配置校验阶段必然 fail-fast。这里改为真实可启动的形态。
#
# 要走真正的生产形态，请自备：
#   * 反向代理/网关终止 HTTPS 并转发
#   * PostgreSQL + Temporal + S3/兼容对象存储
#   * OIDC issuer/client/owner_sub
# 然后设置 FY_ENVIRONMENT=production 并逐项满足上述校验。
#
# 密钥说明：FY_SESSION_SECRET / FY_LOCAL_TOKEN 不再强制手工提供——
# 入口脚本（docker-entrypoint.sh）首启自动生成并持久化到 fy_data 卷；
# 在下方 environment 或 .env 里显式提供的值会被尊重，绝不覆盖。

services:
  fy-orbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: find-yourself-orbit:latest
    container_name: fy-orbit-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 单机形态：local + SQLite + HTTP + 本地 token，是代码真能启动的组合
      - FY_ENVIRONMENT=local
      - FY_DATABASE_URL=sqlite:////app/.runtime/find-yourself.db
      # 两个密钥留空 = 入口脚本首启自动生成（持久化在 fy_data 卷）
      - FY_SESSION_SECRET=${FY_SESSION_SECRET:-}
      - FY_LOCAL_TOKEN=${FY_LOCAL_TOKEN:-}
      - FY_PUBLIC_URL=http://localhost:8000
      - FY_STATIC_DIR=/app/web/dist
      - FY_OFFLINE_MODE=1
      - FY_LOCAL_ONLY=1
      # Docker 端口映射会把客户端地址改写为网桥网关（如 172.17.0.1），
      # 纯 loopback 判定会把所有 Docker 部署挡在游客会话之外。
      # 显式信任本机 Docker 网桥段；外网流量不可能带这些源地址进容器。
      - FY_LOCAL_PEER_CIDRS=172.16.0.0/12
    volumes:
      - fy_data:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fy_data:
    name: fy_orbit_data
