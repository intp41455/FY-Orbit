name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Test & Alembic Single Head Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FY_ENVIRONMENT: test
      FY_OFFLINE_MODE: "true"
      # 测试环境专用占位密钥（>=32 字符）。settings 校验要求非空且足够长，
      # 缺失会让整个 Settings 构造失败、连带几百条用例全红。
      FY_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      # 桌面登录窗口鉴权所需的本机令牌；缺失会让 desktop 进程启动即崩，
      # 连带 test_desktop_window_lifecycle 等集成用例失败。
      FY_LOCAL_TOKEN: ci-only-local-token-0123456789abcdef0123456789
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv pip install --system -e .
          uv pip install --system pytest pytest-asyncio ruff

      - name: HEAD Clean-Tree Gate (migration chain + route import smoke)
        run: |
          PYTHONPATH=src python -m pytest tests/unit/test_migration_chain_gate.py -q
          PYTHONPATH=src python -c "import find_yourself.api.routes; print('IMPORT_OK')"

      - name: Lint (Ruff)
        run: |
          ruff check src tests

      - name: Verify Alembic Single Head
        run: |
          HEADS=$(alembic heads | wc -l)
          echo "Alembic heads output:"
          alembic heads
          if [ "$HEADS" -ne 1 ]; then
            echo "Error: Expected exactly 1 Alembic head, but found $HEADS"
            exit 1
          fi

      - name: Run Backend Test Suite
        run: |
          pytest -q

  frontend:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: |
          npm --prefix web ci || npm --prefix web install

      - name: TypeScript Typecheck
        run: |
          npm --prefix web run typecheck

      - name: Run Frontend Tests (Vitest)
        run: |
          npm --prefix web run test

      - name: Build Web Production Assets
        run: |
          npm --prefix web run build