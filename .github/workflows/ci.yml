name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Test & Alembic Single Head Check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FY_ENVIRONMENT: test
      FY_OFFLINE_MODE: "true"
      # 测试环境专用占位密钥（>=32 字符）。settings 校验要求非空且足够长，
      # 缺失会让整个 Settings 构造失败、连带几百条用例全红。
      FY_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      # 桌面登录窗口鉴权所需的本机令牌；缺失会让 desktop 进程启动即崩，
      # 连带 test_desktop_window_lifecycle 等集成用例失败。
      FY_LOCAL_TOKEN: ci-only-local-token-0123456789abcdef0123456789
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies (锁定安装)
        run: |
          # 用 `uv sync --frozen` 按 uv.lock 精确还原 —— 不再 `uv pip install -e .`
          # 让解析器每次重新选版本。历史事故：一次 `uv lock` 重解析把传递依赖从
          # 120 个推到 193 个，本地「1 条红」在CI 上放大成「50 条红」；非锁定安装
          # 会让「CI 绿 / 本地红」这类不可复现差异成为常态。
          # --frozen：lock 与 pyproject 不一致时**直接失败**，而不是偷偷改 lock。
          uv sync --frozen --group dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: HEAD Clean-Tree Gate (migration chain + route import smoke)
        run: |
          python -m pytest tests/unit/test_migration_chain_gate.py -q
          python -c "import find_yourself.api.routes; print('IMPORT_OK')"

      - name: Base Contract Gate (基座接入硬门禁 · P0-B1)
        run: |
          # A-基座质保-11：`BaseContractService.audit_tree` 是能真的 `exit_code=1`
          # 的门禁，但此前无任何 workflow 调用它（P0-B1）。这里把它接成 CI 硬门禁：
          #   ① 先按既有豁免机制登记纯展示页基线豁免 —— 走真实服务接口
          #      (`scripts/p0/grant_base_exemptions.py`)，因此「可编辑文件不得豁免」
          #      这类硬规则会在登记时真的被校验一遍，不是手写 JSON 绕过；
          #   ② 再跑门禁 (`scripts/p0/run_base_contract_gate.py`)，fail-closed：
          #      存在阻塞违规即 exit 1，并逐条打 `::error::` 注解定位。
          # 本仓真实门禁在 base-contract-gate job 里跑（独立 job，失败信号不被
          # backend job 的其他步骤淹没）；此处保留一次调用作为 backend 内的早期反馈。
          # 当前基线仍有 1 个**可编辑**页面（FortunePage.tsx）未接入基座，且按
          # 「可编辑文件不得豁免」的硬规则不能被豁免，故门禁会如实报红 —— 这正是
          # 要把「门禁能失败」暴露到 CI 上的原因；请勿把本步改成 advisory 或吞掉退出码。
          python scripts/p0/grant_base_exemptions.py
          python scripts/p0/run_base_contract_gate.py

      - name: Lint (Ruff)
        run: |
          # 配置见 pyproject.toml [tool.ruff.lint]。select 已含 F/E9/I/W，
          # 覆盖未定义名、未使用导入/变量、重复定义、导入排序、尾随空格。
          # 含 desktop/（发行链关键脚本，此前被 extend-exclude 排除、无人看门）。
          ruff check src tests desktop

      - name: PowerShell Script Gate (BOM + 语法解析)
        shell: pwsh
        run: |
          # 发行链的构建/生命周期脚本全是 .ps1。两条硬约束此前无任何门禁：
          #  ① 含中文的脚本**必须**带 UTF-8 BOM —— Windows PowerShell 5.1 在无 BOM
          #     时按 CP1252 解析，中文注释/字符串变乱码（build_installer.ps1 历史崩溃根因）。
          #  ② 语法必须能被解析器静态通过（不执行）—— 用 `??`/`?.` 这类 7.0-only
          #     语法会让脚本在目标机（Win10/11 自带 5.1）直接报 ParserError，而 CI
          #     若只跑 pwsh 7 就永远发现不了（PS 双向盲区）。
          # 本地已实测：17 个脚本全绿。
          $ErrorActionPreference = 'Stop'
          $failed = @()

          $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse `
            | Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\\.runtime\\' -and $_.FullName -notmatch '\\\.venv\\' }

          foreach ($s in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($s.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $raw = [System.IO.File]::ReadAllText($s.FullName)
            $hasCjk = $raw -match '[\u4e00-\u9fff]'

            if ($hasCjk -and -not $hasBom) {
              $failed += "缺 UTF-8 BOM（含中文）: $($s.FullName)"
            }

            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $s.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) {
                $failed += "语法错误: $($s.FullName):$($e.Extent.StartLineNumber): $($e.Message)"
              }
            }
          }

          Write-Host "扫描 .ps1 脚本 $($scripts.Count) 个。"
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "PS 脚本门禁通过（BOM + 语法）。"

      - name: Verify Alembic Single Head
        run: |
          HEADS=$(alembic heads | wc -l)
          echo "Alembic heads output:"
          alembic heads
          if [ "$HEADS" -ne 1 ]; then
            echo "Error: Expected exactly 1 Alembic head, but found $HEADS"
            exit 1
          fi

      - name: Run Backend Test Suite (含覆盖率门槛)
        run: |
          # --cov 必须用**包级** `find_yourself`。写成模块级会触发 SQLAlchemy
          # Cython 层 `TypeError: 'InternalTraversal' object is not callable` 假红。
          #
          # --cov-fail-under=82：树 A 实测基线**85%**（40474 stmts / 6272 miss，
          # 已按 [tool.coverage.report].exclude_lines 摘掉abstractmethod /
          # TYPE_CHECKING / __main__ 守卫等不可执行分支）。
          # 取基线下方 3 个点 —— 既能拦下任何覆盖度倒退，又不会因正常新增代码
          # 而频繁爆红。**频繁爆红的门禁最终一定会被人绕过，等于没有门禁。**
          #
          # 插桩代价实测：11 分钟 → 15 分钟（+~35%）。所以 --cov 刻意**不**进
          # addopts，只在 CI 这一处显式开启（见 pyproject 的注释）。
          pytest -q \
            --cov=find_yourself \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=82

  base-contract-gate:
    name: Base Contract Gate (基座接入 fail-closed + 反假绿反向验证)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FY_ENVIRONMENT: test
      FY_OFFLINE_MODE: "true"
      FY_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      FY_LOCAL_TOKEN: ci-only-local-token-0123456789abcdef0123456789
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies (锁定安装)
        run: uv sync --frozen --group dev

      - name: Gate Self-Test (先证明这个门禁会红)
        run: |
          # **顺序很要紧**：先跑反向验证。它在临时目录里造三棵树喂给门禁 ——
          # 契约被破坏 / 契约完好 / 扫描面缺失 —— 并断言真实子进程的退出码。
          # 没有这一步，「CI 里接了个门禁」无法区分「硬门禁」与「永远绿的装饰品」：
          # 一个 `sys.exit(0)` 或 `|| true` 就能让基座形同虚设而 CI 全程无信号。
          # 断言以**子进程**调用脚本，因为退出码才是 CI（set -e）看到的那份契约。
          python -m pytest tests/unit/scripts/test_base_contract_gate.py -q

      - name: Base Contract Gate (本仓真实扫描 · fail-closed)
        run: |
          # 需求 N7「三层分层统一底座」的工程闸门：所有页面 / 可编辑组件必须接入
          # 基座（useBase / BaseBound）或持已审批豁免，否则拒绝合并。
          # ① 豁免走真实服务接口登记，「可编辑文件不得豁免」等硬规则会被真校验；
          # ② 门禁 fail-closed：违规 exit 1 + `::error::` 逐条标注；
          # ③ 扫描面缺失 / 扫到 0 文件同样 exit 1（0 违规 ≠ 契约满足）。
          # 当前基线有 1 个可编辑页面未接入（FortunePage.tsx），故本步**预期报红**——
          # 这是接线清单，不是脚本故障。请勿加 `|| true` 或 continue-on-error。
          python scripts/p0/grant_base_exemptions.py
          python scripts/p0/run_base_contract_gate.py

  layering-gate:
    name: Layering Gate (后端三层分层 fail-closed + 反假绿反向验证)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      FY_ENVIRONMENT: test
      FY_OFFLINE_MODE: "true"
      FY_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      FY_LOCAL_TOKEN: ci-only-local-token-0123456789abcdef0123456789
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies (锁定安装)
        run: uv sync --frozen --group dev

      - name: Gate Self-Test (先证明这个门禁会红)
        run: |
          # 顺序很要紧：先跑反向验证。它在临时目录里造多棵最小树喂给门禁 ——
          # 契约被破坏（R5/R6/V1）/ 契约完好 / 扫描面缺失 / 扫到 0 文件 —— 并断言
          # 真实子进程退出码。没有这一步，「CI 里接了个门禁」无法区分「硬门禁」与
          # 「永远绿的装饰品」：一个 sys.exit(0) 就能让分层形同虚设而 CI 无信号。
          python -m pytest tests/unit/scripts/test_layering_gate.py -q

      - name: Layering Gate (本仓真实扫描 · fail-closed)
        run: |
          # 需求 N7「三层分层统一底座」的后端工程闸门，判据见
          # docs/architecture/three-layer-model.md §4/§9 与 ADR-0001。
          # baseline = scripts/p0/layering_baseline.json（放在工作区可跟踪路径，
          # 不放在被 .gitignore 排除的 .runtime/ 下，否则入不了库、CI 拿不到）。
          # fail-closed：baseline 外新增违规 / 扫描面缺失 / 扫到 0 文件均 exit 1。
          # 请勿把本步改成 advisory、吞退出码或以 continue-on-error 软化。
          python scripts/p0/run_layering_gate.py --baseline scripts/p0/layering_baseline.json

  frontend:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: |
          npm --prefix web ci || npm --prefix web install

      - name: TypeScript Typecheck
        run: |
          npm --prefix web run typecheck

      - name: Run Frontend Tests (Vitest)
        run: |
          npm --prefix web run test

      - name: Build Web Production Assets
        run: |
          npm --prefix web run build