[project]
name = "find-yourself"
version = "0.1.0"
description = "Private companion and governed agent runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "authlib>=1.5,<2", "itsdangerous>=2.2,<3", "httpx>=0.28,<1",
  "temporalio>=1.10,<2", "langgraph>=1,<2", "deepagents>=0.4,<1",
  "langchain-openai>=1,<2", "boto3>=1.38,<2", "pyyaml>=6,<7", "alembic>=1.14,<2",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "cryptography>=44,<50"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_yourself"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
