[project]
name = "find-yourself"
version = "0.1.0"
description = "Private companion and governed agent runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "authlib>=1.5,<2",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
  "temporalio>=1.10,<2",
  "langgraph>=1,<2",
  "langchain-openai>=1,<2",
  "boto3>=1.38,<2",
  "pyyaml>=6,<7",
  "alembic>=1.14,<2",
  "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "cryptography>=44,<50",
  "argon2-cffi>=25.1.0",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  # MCP WebSocket 传输（补齐包3 A-统一接入-02；uvicorn[standard] 已传递引入，此处显式声明）
  "websockets>=14,<17",
  "sqlite-vec>=0.1,<1",
]

[project.optional-dependencies]
gui = [
  "mss>=10.2.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pywinpty>=3,<4; sys_platform == 'win32'",
]
desktop = [
  "pyinstaller>=6.5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_yourself"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["evidence", ".venv", "desktop"]

[tool.ruff.lint]
select = ["E9", "F63"]

